services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    container_name: asktube-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    container_name: asktube-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VECTOR_COLLECTION_NAME: asktube_videos
      # Vectors AND analytics both live in this database. DATABASE_URL takes
      # priority over ANALYTICS_DATABASE_URL, so setting the latter here would
      # be inert and would wrongly suggest analytics still uses SQLite locally.
      DATABASE_URL: postgresql+asyncpg://asktube:asktube@postgres:5432/asktube
      # Data directories
      AUDIO_CACHE_DIR: /app/data/audio_cache
      ANALYTICS_ENABLED: "true"
      PROMETHEUS_ENABLED: "true"
      # CORS — allowed frontend origins. Override in .env for production
      # (JSON array or comma-separated; defaults to local development origins).
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  # ── Postgres (pgvector) ────────────────────────────────────────────────────
  postgres:
    container_name: asktube-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: asktube
      POSTGRES_PASSWORD: asktube
      POSTGRES_DB: asktube
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asktube"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_data:
  postgres_data:
